services:
  - type: web
    name: museo-sang-bata-sa-negros
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USER
        value: admin
      - key: SEED_ADMIN_PASS
        value: museum-admin-2026
      - key: SITE_NAME
        value: Museo Sang Bata sa Negros
