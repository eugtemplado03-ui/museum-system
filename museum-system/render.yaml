services:
  - type: web
    name: museo-sang-bata-sa-negros
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SEED_ADMIN_USER
        value: admin
      - key: SEED_ADMIN_PASS
        value: museum-admin-2026
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Museo Sang Bata sa Negros
      - key: SITE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
