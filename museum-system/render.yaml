services:
  - type: web
    name: museo-sang-bata-sa-negros
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SEED_ADMIN_USER
        value: admin
      - key: SEED_ADMIN_PASS
        value: museum-admin-2026
