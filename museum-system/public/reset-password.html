<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Admin Password | Museo Sang Bata sa Negros</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #eff6ff; }
    .reset-card { width: min(100%, 440px); padding: 28px; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 12px 32px rgba(15, 23, 42, .10); }
    .reset-card h1 { margin: 0 0 8px; font: 800 22px 'Nunito', sans-serif; color: #0f172a; }
    .reset-card p { margin: 0 0 20px; color: #475569; font-size: 14px; }
    .reset-card label { display: block; margin: 14px 0 6px; font-weight: 700; color: #0f172a; }
    .reset-card input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #94a3b8; border-radius: 8px; font: inherit; }
    .reset-card button { width: 100%; margin-top: 18px; }
    .reset-message { min-height: 20px; margin-top: 14px; color: #b91c1c; font-size: 13px; }
    .reset-message.success { color: #047857; }
    .reset-card a { color: #0369a1; font-weight: 700; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Set a new admin password</h1>
    <p>Choose a password with at least 12 characters. This reset link expires after 30 minutes and can only be used once.</p>
    <form id="resetPasswordForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button class="btn-submit" type="submit">Update password</button>
      <div id="resetMessage" class="reset-message" role="status" aria-live="polite"></div>
    </form>
    <a href="/">Return to sign in</a>
  </main>
  <script>
    const form = document.getElementById('resetPasswordForm');
    const message = document.getElementById('resetMessage');
    const token = new URLSearchParams(window.location.search).get('token') || '';
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.classList.remove('success');
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (!token) {
        message.textContent = 'This reset link is invalid or expired. Request a new link.';
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirmPassword })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not update the password.');
        form.reset();
        message.classList.add('success');
        message.textContent = result.message;
      } catch (error) {
        message.textContent = error.message || 'Could not update the password. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
