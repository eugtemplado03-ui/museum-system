<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Admin Password | Museo Sang Bata sa Negros</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #eff6ff; }
    .reset-card { width: min(100%, 440px); padding: 28px; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 12px 32px rgba(15, 23, 42, .10); }
    .reset-card h1 { margin: 0 0 8px; font: 800 22px 'Nunito', sans-serif; color: #0f172a; }
    .reset-card p { margin: 0 0 20px; color: #475569; font-size: 14px; }
    .reset-card label { display: block; margin: 14px 0 6px; font-weight: 700; color: #0f172a; }
    .reset-card input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #94a3b8; border-radius: 8px; font: inherit; }
    .reset-card button { width: 100%; margin-top: 18px; }
    .reset-message { min-height: 20px; margin-top: 14px; color: #b91c1c; font-size: 13px; }
    .reset-message.success { color: #047857; }
    .reset-card a { color: #0369a1; font-weight: 700; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Reset admin password</h1>
    <p>A one-time 8-digit confirmation code will be sent to the admin email. It expires after 10 minutes.</p>
    <form id="requestCodeForm">
      <label for="resetEmail">Admin email</label>
      <input id="resetEmail" type="email" autocomplete="email" required>
      <button class="btn-submit" type="submit">Send confirmation code</button>
      <div id="requestMessage" class="reset-message" role="status" aria-live="polite"></div>
    </form>
    <form id="resetPasswordForm" style="display:none;">
      <input id="confirmEmail" type="hidden">
      <label for="resetCode">Confirmation code</label>
      <input id="resetCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" minlength="8" maxlength="8" required>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button class="btn-submit" type="submit">Confirm code and update password</button>
      <div id="resetMessage" class="reset-message" role="status" aria-live="polite"></div>
    </form>
    <a href="/">Return to sign in</a>
  </main>
  <script>
    const requestForm = document.getElementById('requestCodeForm');
    const form = document.getElementById('resetPasswordForm');
    const requestMessage = document.getElementById('requestMessage');
    const message = document.getElementById('resetMessage');
    const pendingEmail = sessionStorage.getItem('museum_admin_reset_email') || '';
    if (pendingEmail) {
      document.getElementById('resetEmail').value = pendingEmail;
      document.getElementById('confirmEmail').value = pendingEmail;
      requestForm.style.display = 'none';
      form.style.display = 'block';
      message.textContent = 'Enter the confirmation code sent to the admin email.';
    }
    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const button = requestForm.querySelector('button[type="submit"]');
      button.disabled = true;
      requestMessage.classList.remove('success');
      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not request a code.');
        document.getElementById('confirmEmail').value = email;
        requestMessage.classList.add('success');
        requestMessage.textContent = `${result.message} If it matches, enter the code below.`;
        form.style.display = 'block';
      } catch (error) {
        requestMessage.textContent = error.message || 'Could not request a code. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.classList.remove('success');
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('confirmEmail').value,
            code: document.getElementById('resetCode').value.trim(),
            password,
            confirmPassword
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not update the password.');
        form.reset();
        requestForm.reset();
        form.style.display = 'none';
        sessionStorage.removeItem('museum_admin_reset_email');
        message.classList.add('success');
        message.textContent = result.message;
      } catch (error) {
        message.textContent = error.message || 'Could not update the password. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
