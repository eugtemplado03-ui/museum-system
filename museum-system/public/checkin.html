<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Check-in — Museo Sang Bata sa Negros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.checkin-container {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}
.checkin-header {
  text-align: center;
  margin-bottom: 32px;
}
.checkin-header .logo {
  width: 72px;
  height: 72px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: #fff;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(0,174,189,0.35);
}
.checkin-header h1 {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 24px;
  color: var(--ink);
  margin: 0 0 8px;
}
.checkin-header p {
  font-size: 15px;
  color: var(--grey-400);
  margin: 0;
}
.checkin-form {
  background: var(--white);
  border: 1.5px solid var(--grey-100);
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--shadow-md);
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}
.form-group label .required {
  color: var(--danger);
  margin-left: 2px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--grey-200);
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--white);
  transition: border-color 0.15s, box-shadow 0.15s;
  box-sizing: border-box;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(0,174,189,0.15);
}
.form-group textarea {
  min-height: 80px;
  resize: vertical;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.btn-submit {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: var(--teal);
  color: var(--white);
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
  margin-top: 8px;
}
.btn-submit:hover:not(:disabled) {
  background: var(--teal-dark);
  transform: translateY(-1px);
}
.btn-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.error-message {
  background: var(--danger-light);
  border: 1px solid rgba(217,79,61,0.25);
  color: var(--danger);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 20px;
  display: none;
}
.error-message.visible { display: block; }
.success-message {
  background: rgba(6, 28, 38, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255, 255, 255, 0.22);
  color: #ffffff;
  padding: 32px 22px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.50);
  display: none;
}
.success-message.visible { display: block; }
.success-message .icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: rgba(16, 185, 129, 0.20);
  border: 2px solid #10b981;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
}
.success-message h2 {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 23px;
  color: #ffffff;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  margin: 0 0 10px;
}
.success-message p {
  font-size: 15px;
  color: #f1f5f9;
  line-height: 1.6;
  margin: 0 0 20px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}
.success-message p strong {
  color: #5eead4;
  font-weight: 700;
}
@media (max-width: 480px) {
  .form-row { grid-template-columns: 1fr; }
  .checkin-header h1 { font-size: 20px; }
  .checkin-form { padding: 20px 16px; }
  .success-message { padding: 26px 16px; }
}
</style>
</head>
<body>
  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: clamp(20px, 4vw, 48px) 16px; min-height:100vh; min-height:100dvh; box-sizing:border-box;">
    <div class="checkin-container" style="width:100%; max-width:480px; margin:0 auto; padding:0;">
      <form class="checkin-form" id="checkinForm" novalidate>
        <div style="text-align:center; margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--grey-100);">
          <div style="font-size:32px; margin-bottom:6px;">🏛️</div>
          <h1 style="font-family:'Nunito',sans-serif; font-weight:800; font-size:22px; color:var(--ink); margin:0 0 4px;">Visitor Check-in</h1>
          <p style="margin:0; font-size:13px; color:var(--grey-400);">Please fill in your details to log your museum visit</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" id="visitorName" name="visitorName" placeholder="Enter your full name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label>Address <span class="required">*</span></label>
          <textarea id="address" name="address" placeholder="Enter your complete address" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Sex <span class="required">*</span></label>
            <select id="sex" name="sex" required>
              <option value="">Select sex</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>
          <div class="form-group">
            <label>Age <span class="required">*</span></label>
            <input type="number" id="age" name="age" placeholder="Age" min="1" max="120" required>
          </div>
        </div>

        <div class="form-group">
          <label>Contact Number</label>
          <input type="tel" id="contactNumber" name="contactNumber" placeholder="+63 9XX XXX XXXX" autocomplete="tel">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label>Group / Organization (optional)</label>
          <input type="text" id="groupName" name="groupName" placeholder="e.g. School name, Company, etc.">
        </div>

        <div class="form-group">
          <label>Notes (optional)</label>
          <textarea id="notes" name="notes" placeholder="Any special notes or comments..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Check In</button>
        <a href="/" style="display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--teal); text-decoration:none; font-weight:600;">← Return to Museum Home</a>
      </form>

      <div class="success-message" id="successMessage">
        <div class="icon">✅</div>
        <h2>Check-in Successful!</h2>
        <p id="successDetails">Thank you for visiting Museo Sang Bata sa Negros. Your visit has been logged.</p>
        <div style="display:flex; flex-direction:column; gap:10px; width:100%; margin-top:20px;">
          <button type="button" class="btn btn-secondary" id="checkinAnotherBtn" style="width:100%; justify-content:center; padding:13px 18px; font-size:14px; font-weight:700; background:#ffffff; color:#061c26; border:none; border-radius:10px;">➕ Check in another visitor</button>
          <a class="btn btn-primary" href="/exhibits.html" style="width:100%; justify-content:center; padding:13px 18px; font-size:14px; font-weight:700; border-radius:10px;">Explore Exhibits →</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    function escapeHtml(str) {
      return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    const form = document.getElementById('checkinForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const successDetails = document.getElementById('successDetails');
    const checkinAnotherBtn = document.getElementById('checkinAnotherBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorMessage.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking in...';

      const payload = {
        visitorName: document.getElementById('visitorName').value,
        address: document.getElementById('address').value,
        sex: document.getElementById('sex').value,
        age: document.getElementById('age').value,
        contactNumber: document.getElementById('contactNumber').value,
        email: document.getElementById('email').value,
        groupName: document.getElementById('groupName').value,
        notes: document.getElementById('notes').value
      };

      try {
        const res = await fetch('/api/visitors/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'Check-in failed');
        }
        
        form.style.display = 'none';
        const v = data.visitor || {};
        successDetails.innerHTML = `Welcome, <strong>${escapeHtml(v.visitorName || payload.visitorName)}</strong>! Your visit on <strong>${escapeHtml(v.visitDate || '')} at ${escapeHtml(v.visitTime || '')}</strong> has been logged in the museum records.`;
        successMessage.classList.add('visible');
        
      } catch (err) {
        errorMessage.textContent = err.message;
        errorMessage.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Check In';
      }
    });

    checkinAnotherBtn?.addEventListener('click', () => {
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Check In';
      successMessage.classList.remove('visible');
      form.style.display = 'block';
      document.getElementById('visitorName').focus();
    });
  </script>
</body>
</html>
