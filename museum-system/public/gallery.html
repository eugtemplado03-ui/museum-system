<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Museo Sang Bata sa Negros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">
      <div class="brand-mark">M</div>
      <div class="brand-text">
        <div class="name">Museo Sang Bata sa Negros</div>
        <div class="tagline">Exhibit Guide</div>
      </div>
    </a>
    <div class="nav-links">
      <a class="nav-btn" href="/">Scan &amp; Browse</a>
      <a class="nav-btn" href="/programs.html">Programs</a>
      <a class="nav-btn active" href="/gallery.html">Gallery</a>
      <a class="nav-btn" href="/events.html">Events</a>
      <a class="nav-btn" href="/admin.html">Admin</a>
    </div>
  </div>

  <main><div class="wrap">
    <div class="page-hero">
      <h1>Photo gallery</h1>
      <p>A look around the museum — exhibits, workshops, and community activities.</p>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div id="emptyState" style="display:none;" class="empty-state">
      <h2>No photos yet</h2>
      <p>Photos added from the admin dashboard will appear here.</p>
    </div>
  </div></main>
  <footer id="siteFooter"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/chatbot.js"></script>
  <script src="/js/image-enhance.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/footer.js"></script>
  <script>
    function escapeHtml(str){
      return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function galleryItem(g){
      return `
      <div class="gallery-item">
        <a class="img-link" href="${escapeHtml(g.optimizedImagePath || g.imagePath)}" target="_blank" rel="noopener">
          <img class="img-enhance" src="${escapeHtml(g.optimizedImagePath || g.imagePath)}" alt="${escapeHtml(g.title)}" loading="lazy" onerror="this.closest('.gallery-item').style.display='none'">
        </a>
        ${(g.title || g.caption) ? `<div class="caption">${g.title ? `<b>${escapeHtml(g.title)}</b>` : ''}${g.caption ? escapeHtml(g.caption) : ''}</div>` : ''}
      </div>`;
    }

    async function load(){
      const grid = document.getElementById('galleryGrid');
      try{
        const { gallery } = await Api.listGallery();
        if(gallery.length === 0){
          document.getElementById('emptyState').style.display = 'block';
        } else {
          grid.innerHTML = gallery.map(galleryItem).join('');
        }
      }catch(e){
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>${escapeHtml(e.message)}</p></div>`;
      }
    }
    load();
  </script>
</body>
</html>
