<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibit — Museo Sang Bata sa Negros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/gate.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  .leaflet-container { font-family: 'Open Sans', 'Nunito', sans-serif; }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .leaflet-popup-content { margin: 10px 14px; }
</style>
</head>
<body>
  <!-- ── Top Navigation Bar ─────────────────────────────────────── -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle navigation sidebar" title="Open Menu">
        <span class="toggle-bar"></span>
        <span class="toggle-bar"></span>
        <span class="toggle-bar"></span>
      </button>
      <a class="brand" href="/dashboard.html">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <div class="name">Museo Sang Bata sa Negros</div>
          <div class="tagline" style="font-size: 9px; max-width: 400px;">A Hands-on and Interactive Children's Museum. Member of the Intercontinental Museum Network, SAMP</div>
        </div>
      </a>
    </div>
    <div class="nav-links">
      <a class="nav-btn" href="/dashboard.html">Home</a>
      <a class="nav-btn active" href="/exhibits.html">Exhibits</a>
      <a class="nav-btn" href="/programs.html">Programs</a>
      <a class="nav-btn" href="/gallery.html">Gallery</a>
      <a class="nav-btn" href="/events.html">Events</a>
      <a class="nav-btn" href="/admin.html">Admin</a>
    </div>
  </div>

  <div class="user-layout">
    <div class="user-main">
      <main><div class="wrap" style="max-width: 680px;">
    <a class="detail-back" href="/exhibits.html">&larr; Back to exhibits</a>
    <div id="content">Loading exhibit…</div>
  </div></main>

  <script src="/js/api.js"></script>
  <script src="/js/chatbot.js"></script>
  <script src="/js/carousel.js"></script>
  <script src="/js/image-enhance.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    function escapeHtml(str){
      return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    const CATEGORY_ICON = {
      'Marine & Nature':'&#128031;','Touch & Play':'&#9995;','Toys & Collections':'&#129692;',
      'Character & Heritage':'&#127942;','Environmental':'&#9851;','Reading & Learning':'&#128214;','Other':'&#10022;'
    };

    function getAllImages(item){
      if (Array.isArray(item.optimizedImagePaths) && item.optimizedImagePaths.length) return item.optimizedImagePaths;
      if (Array.isArray(item.imagePaths) && item.imagePaths.length) return item.imagePaths;
      if (item.optimizedImagePath) return [item.optimizedImagePath];
      if (item.imagePath) return [item.imagePath];
      return [];
    }

    async function load(){
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const src = params.get('src') === 'scan' ? 'scan' : 'view';
      const content = document.getElementById('content');
      if(!code){
        content.innerHTML = `<div class="empty-state"><h2>No exhibit specified</h2><p>Scan a tag or choose an exhibit from the gallery.</p><a class="btn btn-primary" href="/exhibits.html">Browse all exhibits</a></div>`;
        return;
      }
      try{
        const { exhibit } = await Api.getExhibit(code);
        document.title = exhibit.title + ' — Museo Sang Bata sa Negros';
        Api.trackView(code, src);
        const images = getAllImages(exhibit);

        content.innerHTML = `
          <div class="plaque">
            <div class="plaque-media">
              ${renderMediaBox(images, exhibit.videoUrl, exhibit.title, CATEGORY_ICON[exhibit.category] || CATEGORY_ICON.Other)}
            </div>
            <div class="plaque-body">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
                <div class="plaque-cat">${escapeHtml(exhibit.category)}</div>
                <button class="fav-btn-plaque" id="favToggleBtn" aria-label="Toggle favorite">♡</button>
              </div>
              <h1>${escapeHtml(exhibit.title)}</h1>
              <!-- ── Prominent Location/Direction ── -->
              ${exhibit.location ? `
              <div class="plaque-location-badge" style="display:inline-flex; align-items:center; gap:6px; background:var(--teal-light); color:var(--teal-dark); padding:8px 12px; border-radius:999px; font-size:13px; font-weight:600; margin:6px 0 12px; flex-wrap:wrap;">
                <span>📍</span>
                <span>${escapeHtml(exhibit.location)}</span>
              </div>` : ''}
              <div class="plaque-meta-row">
                <div><span>Origin</span><b>${escapeHtml(exhibit.origin||'—')}</b></div>
                <div><span>Date</span><b>${escapeHtml(exhibit.year||'—')}</b></div>
                <div><span>Location</span><b>${escapeHtml(exhibit.location||'—')}</b></div>
              </div>
              <div style="display:flex; gap:8px; align-items:center; margin-top:6px;">
                <label for="langSelect" style="font-size:13px; color:var(--ink-soft);">Language:</label>
                <select id="langSelect" style="padding:6px 8px; font-size:14px;">
                  <option value="original">Original (English)</option>
                  <option value="tl">Tagalog (Filipino)</option>
                  <option value="cb">Bisaya (Cebuano)</option>
                  <option value="hil">Hiligaynon (Ilonggo)</option>
                </select>
              </div>
              <div class="plaque-cat-detail">Category: <strong>${escapeHtml(exhibit.category)}</strong></div>
              <div class="plaque-desc" id="plaqueDesc" data-desc-original="${escapeHtml(exhibit.description||'')||''}" data-desc-tl="${escapeHtml(exhibit.description_tl||'')||''}" data-desc-cb="${escapeHtml(exhibit.description_cb||'')||''}" data-desc-hil="${escapeHtml(exhibit.description_hil||'')||''}">
                ${escapeHtml(exhibit.description||'No description on file yet.')}
              </div>
              <div class="tts-controls" style="margin-top:10px; display:flex; gap:8px; align-items:center;">
                <button class="btn btn-secondary" id="ttsPlayBtn" aria-label="Play description">🔊 Listen</button>
                <button class="btn btn-secondary" id="ttsStopBtn" aria-label="Stop description">■ Stop</button>
                <div id="ttsStatus" style="font-size:13px; color:var(--ink-soft);"></div>
              </div>
              <div class="plaque-accession mono">Accession No. ${exhibit.code}</div>

              <!-- ── QR Code Section under Information ── -->
              <div class="plaque-qr-section">
                <div class="plaque-qr-image">
                  <img src="${Api.qrUrl(exhibit.code)}" alt="QR tag for ${escapeHtml(exhibit.code)}" width="90" height="90" loading="lazy">
                </div>
                <div class="plaque-qr-details">
                  <div class="plaque-qr-badge">Exhibit QR Tag</div>
                  <div class="plaque-qr-code mono">${exhibit.code}</div>
                  <div class="plaque-qr-hint">Scan with camera to open this guide directly on-site</div>
                </div>
                <a class="btn btn-secondary btn-small plaque-qr-dl" href="${Api.qrUrl(exhibit.code)}" download="${exhibit.code}-tag.png">&#8595; Download QR</a>
              </div>

              <!-- ── Map Section ── -->
              ${(exhibit.lat !== null && exhibit.lat !== undefined && exhibit.lng !== null && exhibit.lng !== undefined) ? `
              <div class="plaque-map-section" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--grey-100);">
                <div style="font-weight:700; color:var(--ink); margin-bottom:8px; font-size:14px;">📍 Location on Map</div>
                <div id="exhibitMap" style="width:100%; height:200px; border-radius:8px; overflow:hidden; background:var(--grey-100);"></div>
                <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
                  <a href="https://www.google.com/maps/search/?api=1&query=${exhibit.lat},${exhibit.lng}" target="_blank" class="btn btn-secondary btn-small">Open in Google Maps</a>
                  <a href="https://www.openstreetmap.org/?mlat=${exhibit.lat}&mlon=${exhibit.lng}#map=15/${exhibit.lat}/${exhibit.lng}" target="_blank" class="btn btn-ghost btn-small">Open in OpenStreetMap</a>
                </div>
              </div>` : ''}
              ${exhibit.mapImagePath ? `
              <div class="plaque-map-image-section" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--grey-100);">
                <div style="font-weight:700; color:var(--ink); margin-bottom:8px; font-size:14px;">🗺️ Floor Plan / Directions</div>
                <div style="position:relative; border-radius:8px; overflow:hidden; max-width:100%;">
                  <img src="${escapeHtml(exhibit.mapImagePath)}" alt="Floor plan showing exhibit location" style="width:100%; height:auto; max-height:300px; object-fit:cover; display:block;">
                </div>
                <div style="margin-top:6px; font-size:11.5px; color:var(--ink-soft); text-align:center;">Tap image to view full screen</div>
              </div>` : ''}

              <!-- ── Ratings & Visitor Reviews Section ── -->
              <section class="exhibit-reviews-section" style="margin-top:28px; padding-top:22px; border-top:1.5px solid rgba(255,255,255,0.12);">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
                  <div>
                    <h3 style="font-family:'Nunito',sans-serif; font-weight:800; font-size:19px; color:#ffffff; margin:0 0 4px; display:flex; align-items:center; gap:8px;">
                      <span>⭐</span> Visitor Ratings &amp; Comments
                    </h3>
                    <p style="margin:0; font-size:13px; color:rgba(255,255,255,0.7);">Hear what other guests loved, or leave your own rating and review</p>
                  </div>
                  <div id="ratingSummary" class="rating-summary-badge"></div>
                </div>

                <!-- Rating & Review Form -->
                <div class="rating-form-card">
                  <div class="rating-form-title">
                    <span>✍️</span> Rate this Exhibit &amp; Share Feedback
                  </div>
                  
                  <div class="rating-form-fields">
                    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
                      <label class="rating-field-label" style="margin-bottom:0;">Your Rating <span class="required" style="color:var(--orange);">*</span>:</label>
                      <div class="stars-input" id="starsInput">
                        ${[1,2,3,4,5].map(n=>`<button type="button" class="star-btn" data-star="${n}" title="${n} Stars">★</button>`).join('')}
                      </div>
                      <span id="starRatingLabel" style="font-size:12.5px; font-weight:700; color:#fbbf24; margin-left:6px;">Tap a star</span>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr; gap:10px;">
                      <div>
                        <label class="rating-field-label">Your Name / Nickname (optional)</label>
                        <input type="text" id="ratingVisitorName" placeholder="e.g. Maria S., Teacher Mark, or leave blank for Visitor" maxlength="50" class="rating-input">
                      </div>
                      <div>
                        <label class="rating-field-label">Your Comment or Experience</label>
                        <textarea id="ratingComment" placeholder="Tell other visitors what you enjoyed, learned, or found fascinating about this exhibit..." maxlength="500" class="rating-textarea"></textarea>
                      </div>
                    </div>

                    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:14px;">
                      <button class="btn btn-primary btn-small" id="submitRatingBtn" style="padding:10px 20px; font-weight:700;">Submit Rating &amp; Review</button>
                      <div id="ratingMsg" style="font-size:12.5px; font-weight:600; color:#5eead4;"></div>
                    </div>
                  </div>
                </div>

                <!-- Visitor Reviews Feed -->
                <div style="margin-top:24px;">
                  <h4 style="font-family:'Nunito',sans-serif; font-size:15px; font-weight:700; color:#ffffff; margin:0 0 12px; display:flex; align-items:center; gap:6px;">
                    <span>💬</span> Visitor Reviews (<span id="reviewsCountSpan">0</span>)
                  </h4>
                  <div class="rating-list" id="ratingList"></div>
                </div>
              </section>
            </div>
          </div>`;

        initPhotoCarousels(content);
        wireFavorite(exhibit);
        wireRatings(exhibit, code);
        wireTTS(exhibit);
        initMap(exhibit);
      }catch(e){
        console.error('Exhibit load error:', e);
        content.innerHTML = `<div class="empty-state"><h2>Tag not recognized</h2><p>No exhibit matches code "${escapeHtml(code)}". It may have been moved or retired.</p><a class="btn btn-primary" href="/exhibits.html">Browse all exhibits</a></div>`;
      }
    }

    // ── Map Initialization ────────────────────────────────────────────
    function initMap(exhibit) {
      const mapEl = document.getElementById('exhibitMap');
      if (!mapEl) return;
      if (exhibit.lat === null || exhibit.lat === undefined || exhibit.lng === null || exhibit.lng === undefined) {
        mapEl.style.display = 'none';
        return;
      }
      try {
        const map = L.map('exhibitMap').setView([exhibit.lat, exhibit.lng], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(map);
        L.marker([exhibit.lat, exhibit.lng]).addTo(map)
          .bindPopup(`<b>${escapeHtml(exhibit.title)}</b><br>${escapeHtml(exhibit.location || '')}`)
          .openPopup();
      } catch (e) {
        console.error('Map init error:', e);
        mapEl.style.display = 'none';
      }
    }

    // ── AI-powered voice & multi-language translation ───────────────
    function wireTTS(exhibit) {
      const playBtn    = document.getElementById('ttsPlayBtn');
      const stopBtn    = document.getElementById('ttsStopBtn');
      const statusEl   = document.getElementById('ttsStatus');
      const descEl     = document.getElementById('plaqueDesc');
      const langSelect = document.getElementById('langSelect');
      if (!playBtn || !stopBtn || !descEl) return;

      // Cache pre-translated texts and fetched translations
      const _cache = {
        original: descEl.dataset.descOriginal || exhibit.description || '',
        tl: descEl.dataset.descTl || exhibit.description_tl || '',
        cb: descEl.dataset.descCb || exhibit.description_cb || '',
        hil: descEl.dataset.descHil || exhibit.description_hil || ''
      };
      let _currentText = _cache.original;
      let _audioEl = null;   // currently playing <audio> element

      function setStatus(msg, isLoading) {
        statusEl.textContent = msg;
        playBtn.disabled  = isLoading || false;
        stopBtn.disabled  = !isLoading;
      }

      function stopAudio() {
        if (_audioEl) {
          _audioEl.pause();
          _audioEl.src = '';
          _audioEl = null;
        }
        setStatus('', false);
      }

      // ── Translate via OpenRouter or use pre-stored curated translation ──
      async function fetchTranslation(targetLang) {
        if (_cache[targetLang] && _cache[targetLang].trim()) {
          return _cache[targetLang].trim();
        }
        const originalText = _cache.original || exhibit.description || '';
        if (!originalText.trim()) return originalText;
        setStatus('Translating…', true);
        try {
          const resp = await fetch('/api/tts/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: originalText, targetLang }),
          });
          if (!resp.ok) throw new Error('API error');
          const { translatedText } = await resp.json();
          if (translatedText) {
            _cache[targetLang] = translatedText;
          }
          setStatus('', false);
          return translatedText || originalText;
        } catch (e) {
          setStatus('Translation failed — using original.', false);
          return originalText;
        }
      }

      // ── Speak text using high-fidelity natural voice streaming ──────────
      async function speakCurrent() {
        stopAudio();
        const textToSpeak = _currentText || _cache.original;
        if (!textToSpeak || !textToSpeak.trim()) {
          setStatus('No description to read.', false);
          return;
        }
        // Try server TTS first, fallback to browser speech synthesis
        try {
          setStatus('⏳ Generating audio…', true);
          const currentLang = (langSelect && langSelect.value !== 'original') ? langSelect.value : 'en';
          const resp = await fetch('/api/tts/speak', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: textToSpeak, lang: currentLang }),
          });
          if (!resp.ok) throw new Error('TTS API error ' + resp.status);

          const blob = await resp.blob();
          const url  = URL.createObjectURL(blob);
          _audioEl   = new Audio(url);
          _audioEl.onplay  = () => setStatus('🔊 Playing…', true);
          _audioEl.onended = () => { URL.revokeObjectURL(url); _audioEl = null; setStatus('', false); };
          _audioEl.onerror = () => { URL.revokeObjectURL(url); _audioEl = null; setStatus('Playback error.', false); };
          await _audioEl.play();
        } catch (e) {
          console.warn('[TTS speak] server TTS failed, trying browser fallback:', e);
          // Fallback: browser built-in speech synthesis
          try {
            setStatus('🔊 Playing (browser voice)…', true);
            const utter = new SpeechSynthesisUtterance(textToSpeak);
            utter.lang = (langSelect?.value === 'tl' || langSelect?.value === 'cb' || langSelect?.value === 'hil') ? 'fil-PH' : 'en-US';
            utter.onend = () => setStatus('', false);
            utter.onerror = () => setStatus('Audio unavailable.', false);
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utter);
          } catch (e2) {
            console.error('[TTS speak] both failed:', e2);
            setStatus('Audio unavailable — check connection.', false);
          }
        }
      }

      // ── Language select handler ───────────────────────────────────
      if (langSelect) {
        langSelect.addEventListener('change', async () => {
          stopAudio();
          const v = langSelect.value;
          if (v === 'original') {
            _currentText = _cache.original;
            descEl.textContent = _currentText || 'No description on file yet.';
            setStatus('', false);
          } else {
            const translated = await fetchTranslation(v);
            _currentText = translated;
            descEl.textContent = translated;
          }
        });
      }

      playBtn.addEventListener('click', speakCurrent);
      stopBtn.addEventListener('click', stopAudio);
      window.addEventListener('pagehide', stopAudio);
    }

    async function wireFavorite(exhibit){
      const btn = document.getElementById('favToggleBtn');
      let isFav = false;
      try{
        const { exhibits } = await Api.listFavorites();
        isFav = exhibits.some(e => e.id === exhibit.id);
        btn.textContent = isFav ? '♥' : '♡';
        btn.classList.toggle('active', isFav);
      }catch(e){ /* ignore */ }
      btn.addEventListener('click', async ()=>{
        try{
          if(isFav){ await Api.removeFavorite(exhibit.id); isFav = false; }
          else { await Api.addFavorite(exhibit.id); isFav = true; }
          btn.textContent = isFav ? '♥' : '♡';
          btn.classList.toggle('active', isFav);
        }catch(e){ /* ignore */ }
      });
    }

    function starString(avg){
      const rounded = Math.round(avg);
      return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
    }

    const STAR_LABELS = { 1: '1 Star — Poor', 2: '2 Stars — Fair', 3: '3 Stars — Good', 4: '4 Stars — Very Good', 5: '5 Stars — Excellent!' };

    function renderRatingSummary(summary){
      const el = document.getElementById('ratingSummary');
      if(!el) return;
      if(!summary || !summary.count){
        el.innerHTML = `<span style="font-size:12.5px; color:rgba(255,255,255,0.7); font-weight:600;">No ratings yet — be the first!</span>`;
        return;
      }
      el.innerHTML = `
        <span class="avg">${summary.average.toFixed(1)}</span>
        <span class="stars">${starString(summary.average)}</span>
        <span class="count">(${summary.count} review${summary.count===1?'':'s'})</span>`;
    }

    function renderRatingList(ratings){
      const el = document.getElementById('ratingList');
      const countEl = document.getElementById('reviewsCountSpan');
      if(!el) return;
      
      const list = Array.isArray(ratings) ? ratings : [];
      if(countEl) countEl.textContent = list.length;

      if(list.length === 0){
        el.innerHTML = `
          <div style="background:rgba(6,28,38,0.6); border:1px dashed rgba(255,255,255,0.18); border-radius:12px; padding:20px; text-align:center; color:rgba(255,255,255,0.7); font-size:13.5px;">
            No visitor reviews yet for this exhibit. Be the first to share your thoughts above!
          </div>`;
        return;
      }

      el.innerHTML = list.map(r => {
        const name = escapeHtml(r.visitorName || 'Visitor');
        const initial = (name.charAt(0) || 'V').toUpperCase();
        const stars = '★'.repeat(r.rating || 5) + '☆'.repeat(5 - (r.rating || 5));
        const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) : 'Recently';
        const comment = r.comment ? escapeHtml(r.comment) : '<em style="color:#94a3b8; font-size:12.5px;">Rated without written comment</em>';

        return `
          <div class="rating-item">
            <div class="rating-item-header">
              <div class="reviewer-info">
                <div class="reviewer-avatar">${initial}</div>
                <div>
                  <div class="reviewer-name">${name}</div>
                  <div class="reviewer-date">${dateStr}</div>
                </div>
              </div>
              <div class="stars" title="${r.rating || 5} Stars">${stars}</div>
            </div>
            <div class="comment">${comment}</div>
          </div>
        `;
      }).join('');
    }

    async function wireRatings(exhibit, code){
      let selected = 0;
      const starsInput = document.getElementById('starsInput');
      const starLabel = document.getElementById('starRatingLabel');
      const msg = document.getElementById('ratingMsg');
      const nameInput = document.getElementById('ratingVisitorName');
      const commentInput = document.getElementById('ratingComment');
      const submitBtn = document.getElementById('submitRatingBtn');

      function paintStars(tempVal){
        const val = tempVal !== undefined ? tempVal : selected;
        starsInput.querySelectorAll('.star-btn').forEach(btn => {
          const starNum = Number(btn.dataset.star);
          btn.classList.toggle('filled', starNum <= val);
        });
        if(starLabel){
          starLabel.textContent = STAR_LABELS[val] || (selected ? STAR_LABELS[selected] : 'Tap a star');
        }
      }

      if(starsInput){
        starsInput.querySelectorAll('.star-btn').forEach(btn => {
          btn.addEventListener('mouseenter', () => paintStars(Number(btn.dataset.star)));
          btn.addEventListener('mouseleave', () => paintStars());
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            selected = Number(btn.dataset.star);
            paintStars();
          });
        });
      }

      try{
        const { summary, ratings } = await Api.getRatings(code);
        renderRatingSummary(summary);
        renderRatingList(ratings);
      }catch(e){ /* ignore */ }

      if(submitBtn){
        submitBtn.addEventListener('click', async (e)=>{
          e.preventDefault();
          if(!selected){
            msg.textContent = '⚠️ Please tap a star rating (1–5) first.';
            msg.style.color = 'var(--orange)';
            return;
          }
          const comment = (commentInput ? commentInput.value : '').trim();
          const visitorName = (nameInput ? nameInput.value : '').trim();

          msg.textContent = '⏳ Submitting review…';
          msg.style.color = '#5eead4';
          submitBtn.disabled = true;

          try{
            const { summary } = await Api.submitRating(code, selected, comment, visitorName);
            renderRatingSummary(summary);
            const { ratings } = await Api.getRatings(code);
            renderRatingList(ratings);
            msg.textContent = '✅ Thank you! Your review has been posted.';
            msg.style.color = '#4ade80';
            if(commentInput) commentInput.value = '';
          }catch(err){
            msg.textContent = '❌ ' + (err.message || 'Failed to submit rating.');
            msg.style.color = 'var(--danger)';
          }finally{
            submitBtn.disabled = false;
          }
        });
      }
    }

    load();
  </script>
      </main>
    </div>
  </div>

  <script src="/js/footer.js"></script>
