<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Museo Sang Bata sa Negros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=19">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* ── Dedicated Admin Navy Topbar ────────────────────────────── */
  .admin-topbar-header {
    background: #0F172A !important;
    border-bottom: 1.5px solid rgba(255, 255, 255, 0.12) !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25) !important;
    color: #FFFFFF !important;
  }
  .admin-brand,
  .admin-brand .name {
    color: #FFFFFF !important;
    font-weight: 800 !important;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3) !important;
  }
  .admin-badge-sub {
    color: rgba(255, 255, 255, 0.8) !important;
  }
  .admin-badge-pill {
    background: rgba(59, 130, 246, 0.25) !important;
    color: #60A5FA !important;
    border: 1px solid rgba(59, 130, 246, 0.45) !important;
    font-weight: 800 !important;
  }
  .admin-context-pill {
    background: rgba(255, 255, 255, 0.10) !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    color: #FFFFFF !important;
    font-weight: 700 !important;
  }
  .admin-view-site-link {
    background: rgba(59, 130, 246, 0.2) !important;
    border: 1px solid rgba(59, 130, 246, 0.45) !important;
    color: #FFFFFF !important;
    font-weight: 700 !important;
  }
  .admin-view-site-link:hover {
    background: #3B82F6 !important;
    color: #FFFFFF !important;
  }
  .admin-curator-chip {
    background: rgba(255, 255, 255, 0.1) !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    color: #FFFFFF !important;
  }
  .sidebar-toggle-btn {
    background: rgba(255, 255, 255, 0.15) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.25) !important;
  }
  .sidebar-toggle-btn .toggle-bar {
    background: #FFFFFF !important;
  }

  /* ── Dedicated Admin Sidebar: Bold White Text ───────────────── */
  .admin-sidebar {
    background: #0F172A !important;
    border-right: 1px solid #1E293B !important;
  }
  .admin-sidebar-title,
  .admin-sidebar-title span {
    color: #FFFFFF !important;
    font-weight: 800 !important;
    opacity: 0.95;
  }
  .admin-sidebar-section-title {
    color: #FFFFFF !important;
    font-size: 11.5px !important;
    font-weight: 900 !important;
    letter-spacing: 0.1em !important;
    text-transform: uppercase !important;
    opacity: 0.95;
  }
  .admin-sidebar-btn {
    color: #FFFFFF !important;
    font-weight: 700 !important;
  }
  .admin-sidebar-label {
    color: #FFFFFF !important;
    font-weight: 700 !important;
  }
  .admin-sidebar-btn:hover {
    background: rgba(255, 255, 255, 0.12) !important;
    color: #FFFFFF !important;
  }
  .admin-sidebar-btn.active {
    background: #3B82F6 !important;
    color: #FFFFFF !important;
    font-weight: 800 !important;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35) !important;
  }
  .admin-sidebar-btn.active .admin-sidebar-label {
    color: #FFFFFF !important;
    font-weight: 800 !important;
  }
  .admin-sidebar-signout {
    color: #FFFFFF !important;
    font-weight: 700 !important;
    border: 1.5px solid rgba(255, 255, 255, 0.2) !important;
  }
  .admin-sidebar-signout:hover {
    background: rgba(255, 255, 255, 0.12) !important;
    color: #FFFFFF !important;
  }

  /* ── Universal Header & Sidepanel White Text Enforcement ── */
  .admin-topbar-header,
  .admin-topbar-header *,
  .topbar,
  .topbar *,
  .admin-sidebar,
  .admin-sidebar *,
  .user-sidebar,
  .user-sidebar * {
    color: #FFFFFF !important;
  }
</style>
</head>
<body class="admin-portal-body">
  <!-- Dedicated Admin Management Topbar (Replaces public visitor navigation) -->
  <div class="topbar admin-topbar-header" style="background:#0F172A !important; color:#ffffff !important;">
    <div class="topbar-left">
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle admin sidebar" title="Open Admin Menu" style="background:rgba(255,255,255,0.15) !important; border:1.5px solid rgba(255,255,255,0.25) !important;">
        <span class="toggle-bar" style="background:#ffffff !important;"></span>
        <span class="toggle-bar" style="background:#ffffff !important;"></span>
        <span class="toggle-bar" style="background:#ffffff !important;"></span>
      </button>
      <a class="brand admin-brand" href="/admin.html" style="color:#ffffff !important;">
        <div class="brand-mark" style="background:#3B82F6 !important; color:#ffffff !important;">M</div>
        <div class="brand-text">
          <div class="name" style="color:#ffffff !important; font-weight:800 !important;">Museo Sang Bata sa Negros</div>
          <div class="admin-badge-row">
            <span class="admin-badge-pill" style="color:#ffffff !important; background:#3B82F6 !important; border:1px solid #60A5FA !important; font-weight:800 !important;">🛡️ Admin</span>
            <span class="admin-badge-sub hide-mobile" style="color:#ffffff !important; opacity:0.9 !important;">Management Console</span>
          </div>
        </div>
      </a>
    </div>

    <!-- Management Context & Header Actions -->
    <div class="admin-header-right">
      <!-- Active Section Context Indicator (Desktop/Tablet) -->
      <div class="admin-context-pill hide-mobile" id="adminContextPill" title="Current Active Section" style="background:rgba(255,255,255,0.1) !important; color:#ffffff !important; border:1px solid rgba(255,255,255,0.16) !important;">
        <span class="context-pulse-dot" style="background:#3B82F6 !important;"></span>
        <span id="adminContextTitle" class="context-label" style="color:#ffffff !important; font-weight:700 !important;">📊 Dashboard Overview</span>
      </div>

      <!-- Quick Action: Preview Public Visitor Site -->
      <a class="admin-view-site-link" id="adminViewSiteBtn" href="/dashboard.html" title="View live public museum website" style="background:rgba(59,130,246,0.25) !important; color:#ffffff !important; border:1px solid rgba(59,130,246,0.5) !important; font-weight:700 !important;">
        <span class="site-icon">🌐</span>
        <span class="site-label hide-mobile" style="color:#ffffff !important;">View Public Site</span>
        <span class="site-arrow hide-mobile" style="color:#ffffff !important;">↗</span>
      </a>

      <!-- Curator Profile Chip -->
      <div class="admin-curator-chip hide-mobile" style="background:rgba(255,255,255,0.1) !important; color:#ffffff !important; border:1px solid rgba(255,255,255,0.16) !important;">
        <span class="curator-avatar">👤</span>
        <span class="curator-role" style="color:#ffffff !important;">Curator</span>
      </div>

      <!-- Sign Out Button -->
      <button type="button" class="admin-header-signout-btn" id="topbarSignOutBtn" title="Sign out of Admin Portal" style="background:rgba(220,38,38,0.25) !important; border:1px solid rgba(239,68,68,0.45) !important; color:#ffffff !important;">
        <span style="color:#ffffff !important;">⎋</span>
        <span class="signout-label hide-mobile" style="color:#ffffff !important;">Sign Out</span>
      </button>
    </div>
  </div>

  <div id="app">Loading…</div>
  <footer id="siteFooter"></footer>
  
  <script src="/js/api.js"></script>
  <script src="/js/gate.js"></script>
  <script src="/js/image-enhance.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/carousel.js"></script>
  <script src="/js/admin.js?v=22"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
