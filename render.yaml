services:
  - type: web
    name: museo-sang-bata-sa-negros
    runtime: node
    rootDir: museum-system
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USER
        value: admin
      - key: SEED_ADMIN_PASS
        value: museum-admin-2026
      - key: SITE_NAME
        value: Museo Sang Bata sa Negros
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: FISH_AUDIO_MODEL
        value: s2.1-pro-free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TRANSLATION_API_KEY
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
